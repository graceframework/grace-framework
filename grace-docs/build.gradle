configurations {
    // Required to keep Gradle classes off the test compile classpath.
    gradleConf.extendsFrom compileClasspath
    compileClasspath {
        exclude group: 'org.apache.groovy', module: 'groovy-xml'
    }
}

dependencies {
    gradleConf gradleApi()
    api libs.asciidoctorj
    api libs.ant
    api libs.commons.text
    api libs.grails.gdoc.engine
    api libs.groovy.ant
    api libs.groovy.templates
    api libs.jsoup
    api libs.slf4j.jcl
    api libs.snakeyaml
    api libs.xhtmlrenderer, {
        exclude group: 'bouncycastle', module:'bcprov-jdk14'
    }

    runtimeOnly libs.slf4j.api
    runtimeOnly libs.itext

    testImplementation libs.spock.core, { transitive = false }
}

sourceSets {
    main {
        compileClasspath = configurations.gradleConf
    }
}

tasks.register('docResourcesJar', Jar) {
    description = 'Package up resources used for generating documentation.'
    archiveVersion = null
    archiveFileName = "grace-doc-resources.jar"
    from "src/main/template"
}

tasks.named('jar', Jar) {
    dependsOn docResourcesJar
    from docResourcesJar
}

eclipse {
    classpath {
        plusConfigurations += [configurations.gradleConf]
    }
}
