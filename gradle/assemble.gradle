// Gradle assemble tasks
import org.grails.gradle.Dependency
import org.grails.gradle.GraceCreateStartScripts

tasks.register('createGraceStartScripts', GraceCreateStartScripts) {
    dependsOn = [publishToDist]
    defaultJvmOpts = ["-XX:+TieredCompilation", "-XX:TieredStopAtLevel=1", "-XX:CICompilerCount=3"]
    outputDir = file('bin')
    classpath = rootProject.childProjects['grace-shell'].configurations.runtimeClasspath
    unixStartScriptTemplate = rootProject.childProjects['grace-shell'].resources.text.fromFile('src/main/resources/unixStartScript.txt')
    windowsStartScriptTemplate = rootProject.childProjects['grace-shell'].resources.text.fromFile('src/main/resources/windowsStartScript.txt')
    projectArtifacts = rootProject.childProjects['grace-shell'].tasks['jar'].outputs.files.collect { "dist/${it.name}" }

    def homeLibDir = rootProject.file('lib')
    def resolvedArtifacts = []
    def artifactsPath = []
    def configuration = rootProject.childProjects['grace-shell'].configurations.runtimeClasspath
    def artifactCollection = configuration.incoming.artifacts
    def artifacts = artifactCollection.artifacts
    artifacts.each { ResolvedArtifactResult artifact ->
        String cid = artifact.id.componentIdentifier.displayName
        String group
        String name
        String version
        File file = artifact.file
        if (cid.startsWith('project :')) {
            group = 'org.graceframework'
            name = cid.substring(9)
            version = graceVersion
        }
        else {
            String[] strs = cid.split(':')
            group = strs[0]
            name = strs[1]
            version = strs[2]
        }

        resolvedArtifacts.add(new Dependency(group: group, name: name, version: version, file: file))

        if (group.startsWith('org.graceframework')) {
            artifactsPath.add("dist/${file.name}")
        }
        else {
            artifactsPath.add("lib/$group/$name/jars/${file.name}")
        }
    }
    dependentArtifacts = artifactsPath

    def graceFile = file('bin/grace')
    def graceBatFile = file('bin/grace.bat')
    doLast {
        resolvedArtifacts.each { Dependency dependency ->
            String group = dependency.group
            String name = dependency.name
            if (group.startsWith('org.graceframework')) {
                ant.copy(file: dependency.file, todir: "${homeLibDir}/org.graceframework")
            }
            else {
                ant.copy(file: dependency.file, todir: "${homeLibDir}/${group}/${name}/jars")
            }
        }
        ant.replace(file: graceFile, token: 'APP_HOME', value: 'GRACE_HOME')
        ant.replace(file: graceFile, token: 'media/gradle.icns', value: 'media/icons/grace.icns')
        ant.replace(file: graceBatFile, token: 'APP_HOME', value: 'GRACE_HOME')
    }
}

tasks.register('install') {
    dependsOn = [createGraceStartScripts]
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite')) {
            dependsOn("$project.name:publishToMavenLocal")
        }
    }
}

tasks.register('publishToDist') {
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite') && !project.name.startsWith('grace-dependencies') && !project.name.startsWith('grace-bom')) {
            project.tasks.named("generateMetadataFileForIvyPublication").configure {
                enabled = false
            }
            dependsOn("$project.name:publishAllPublicationsToGraceDistRepository")
        }
    }
}

tasks.register('publishToRepo') {
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite')) {
            project.tasks.named("generateMetadataFileForMavenPublication").configure {
                enabled = true
            }
            dependsOn("$project.name:publishAllPublicationsToGraceRepoRepository")
        }
    }
}

tasks.register('binZip', Zip) {
    dependsOn = [publishToDist, createGraceStartScripts]
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'bin'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'bin/grace', 'bin/grace.bat', 'LICENSE.txt', 'INSTALL.txt'
        }
        from("lib") {
            into "lib"
            exclude "org.graceframework/**"
        }
        from("lib/org.graceframework") {
            into "dist"
            include '**/*.jar'
        }
        from(homeDistDir) {
            into "dist"
            include "grace-shell-*.jar"
            exclude "*.zip*"
            exclude "*.tar*"
            exclude '*-javadoc.jar*', '*-sources.jar*', 'ivy-*', '*.jar.sha*'
        }
    }
}

tasks.register('sourcesZip', Zip) {
    dependsOn = [publishToDist]
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'sources'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'LICENSE.txt'
        }
        from(homeDistDir) {
            into "src"
            include '*-sources.jar', '*-sources.jar.sha*'
        }
    }
}

tasks.register('docsZip', Zip) {
    dependsOn = ['docs:docs']
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'docs'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'LICENSE.txt'
        }
        from("$projectDir/docs/build/docs/manual") {
            into "docs"
        }
    }
}

tasks.register('bundleZip', Zip) {
    dependsOn = [publishToRepo]
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'bundle'
    from(homeRepoDir)
}

tasks.register('zipDist') {
    dependsOn = [binZip, sourcesZip, docsZip, bundleZip]
}

tasks.register('assemble') {
    dependsOn = [install, zipDist]
}
