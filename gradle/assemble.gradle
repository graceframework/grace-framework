// Gradle assemble tasks
tasks.register('install') {
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite')) {
            project.tasks.named("generateMetadataFileForMavenPublication").configure {
                enabled = true
            }
            dependsOn("$project.name:publishToMavenLocal")
        }
    }
}

tasks.register('publishToDist') {
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite') && !project.name.startsWith('grace-dependencies') && !project.name.startsWith('grace-bom')) {
            project.tasks.named("generateMetadataFileForIvyPublication").configure {
                enabled = false
            }
            dependsOn("$project.name:publishAllPublicationsToGraceDistRepository")
        }
    }
}

tasks.register('publishToRepo') {
    subprojects { Project project ->
        if (project.name != 'docs' && !project.name.startsWith('grace-test-suite')) {
            project.tasks.named("generateMetadataFileForMavenPublication").configure {
                enabled = true
            }
            dependsOn("$project.name:publishAllPublicationsToGraceRepoRepository")
        }
    }
}

tasks.register('binZip', Zip) {
    dependsOn = [publishToDist, 'grace-shell:createGraceStartScripts']
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'bin'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'LICENSE.txt', 'INSTALL.txt'
        }
        from("bin") {
            into "bin"
            include 'grace'
            filePermissions { unix(0755) }
        }
        from("bin") {
            into "bin"
            include 'grace.bat'
            dirPermissions { unix(0755) }
            filePermissions { unix(0644) }
        }
        from("lib") {
            into "lib"
            exclude "org.graceframework/**"
        }
        from("lib/org.graceframework") {
            into "dist"
            include '**/*.jar'
        }
        from(homeDistDir) {
            into "dist"
            include "grace-shell-*.jar"
            exclude "*.zip*"
            exclude "*.tar*"
            exclude '*-javadoc.jar*', '*-sources.jar*', 'ivy-*', '*.jar.sha*'
        }
    }
}

tasks.register('sourcesZip', Zip) {
    dependsOn = [publishToDist]
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'sources'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'LICENSE.txt'
        }
        from(homeDistDir) {
            into "src"
            include '*-sources.jar', '*-sources.jar.sha*'
        }
    }
}

tasks.register('docsZip', Zip) {
    dependsOn = ['docs:docs']
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'docs'

    into("grace-$graceVersion") {
        from(projectDir) {
            include 'LICENSE.txt'
        }
        from("$projectDir/docs/build/docs/manual") {
            into "docs"
        }
    }
}

tasks.register('bundleZip', Zip) {
    dependsOn = [publishToRepo]
    destinationDirectory = rootProject.layout.buildDirectory.dir('distributions')
    archiveBaseName = 'grace'
    archiveAppendix = graceVersion
    archiveClassifier = 'bundle'
    from(homeRepoDir)
}

tasks.register('zipDist') {
    dependsOn = [binZip, sourcesZip, docsZip, bundleZip]
}

tasks.register('assemble') {
    dependsOn = [install, zipDist]
}
