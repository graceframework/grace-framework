buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.graceframework:grace-gradle-plugin:$graceVersion"
        classpath "org.graceframework.plugins:views-gradle:$functionalTestViewsGradleVersion"
        classpath "org.gradle:test-retry-gradle-plugin:1.3.1"
    }
}

version "0.1-SNAPSHOT"
group "functional.tests.plugin"

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: "org.graceframework.grace-plugin"
apply plugin: "org.graceframework.plugins.views-json"
apply plugin: "org.graceframework.plugins.views-markup"
apply plugin: "org.gradle.test-retry"

repositories {
    mavenCentral()
}

dependencies {
    api "org.springframework.boot:spring-boot-starter-actuator"
    api 'org.springframework.boot:spring-boot-starter-logging'
    api "org.springframework.boot:spring-boot-starter-web"

    api "org.graceframework:grace-boot"
    api "org.graceframework:grace-core"

    api project(":views-json")
    api project(":views-markup")
}

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    configure {
        retry {
            maxRetries = 2
            maxFailures = 20
            failOnPassedAfterRetry = true
        }
    }
}

compileGsonViews {
    classpath += configurations.compileClasspath
}
