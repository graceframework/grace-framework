buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath libs.groovy.toml
    }
}

apply plugin: 'java-platform'
apply plugin: 'maven-publish'

class Dependency {
    String groupId
    String artifactId
    String version
    String type
    String scope
}

def projectVersion = project.version
def isBuildSnapshot = projectVersion.endsWith("-SNAPSHOT")
def toml = new groovy.toml.TomlSlurper()
def grace = toml.parse(rootProject.file('gradle/grace.versions.toml'))
def libs = toml.parse(rootProject.file('gradle/libs.versions.toml'))

def bundles = libs.bundles
def libraries = bundles*.value.flatten().unique().sort()
def libraryVersions = libraries.collect({ libs.libraries[it] })*.version.ref.unique().sort()
def properties = [:]
def dependencies = []

for (ver in libraryVersions) {
    String version = libs.versions[ver]
    properties["${ver}.version"] = version
}

for (dep in grace.plugins) {
    String version = dep.value
    properties["grace-plugin.${dep.key}.version"] = version
}

for (dep in grace.profiles) {
    String version = dep.value
    properties["grace-profile.${dep.key}.version"] = version
}

for (sub in project.parent.subprojects) {
    if (sub.name == 'docs' || sub.name == 'grace-bom' || sub.name.contains('test-suite')) continue

    dependencies << new Dependency(
        groupId: sub.group,
        artifactId: sub.name,
        version: "\${grace-framework.version}"
    )
}

for (lib in libraries) {
    def dep = libs.libraries[lib]
    def groupId = dep.module.split(':')[0]
    def artifactId = dep.module.split(':')[1]
    def version = libs.versions[dep.version.ref]
    dependencies << new Dependency(
        groupId: groupId,
        artifactId: artifactId,
        version: "\${${dep.version.ref}.version}",
        type: (lib in libs.bundles.boms) ? 'pom': '',
        scope: (lib in libs.bundles.boms) ? 'import': ''
    )
}

for (plugin in grace.plugins) {
    String artifactId = plugin.key
    String version = "\${grace-plugin.${plugin.key}.version}"
    dependencies << new Dependency(
        groupId: 'org.graceframework.plugins',
        artifactId: artifactId,
        version: version
    )
}

for (profile in grace.profiles) {
    String artifactId = profile.key
    String version = "\${grace-profile.${profile.key}.version}"
    dependencies << new Dependency(
        groupId: 'org.graceframework.profiles',
        artifactId: artifactId,
        version: version
    )
}


publishing {
    repositories {
        maven {
            name = 'graceRepo'
            url = homeRepoDir
        }
    }
    publications {
        maven(MavenPublication) {
            pom {
                name = 'Grace BOM'
                description = 'Grace Framework : Grace BOM'
                url = 'https://github.com/graceframework/grace-framework'

                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'https://github.com/graceframework/grace-framework'
                    connection = 'scm:git:git://github.com/graceframework/grace-framework.git'
                    developerConnection = 'scm:git:ssh://git@github.com/graceframework/grace-framework.git'
                }

                developers {
                    developer {
                        id = 'rainboyan'
                        name = 'Michael Yan'
                        email = 'rain@rainboyan.com'
                    }
                }
            }
            pom.withXml {
                def xml = asNode()

                xml.children().last() + {
                    def mkp = delegate

                    mkp.properties {

                        properties.sort { it.key[0..-9] }.each { name, version ->
                            if (!isBuildSnapshot && version.endsWith("-SNAPSHOT")) {
                                throw new RuntimeException("Cannot have a snapshot dependency on [$dep.key] for a release!")
                            }
                            mkp."${name}"(version)
                        }

                    }

                    mkp.dependencyManagement {
                        mkp.dependencies {

                            for (dep in dependencies.sort { it.version[2..-10] }) {
                                mkp.dependency {
                                    mkp.groupId dep.groupId
                                    mkp.artifactId dep.artifactId
                                    mkp.version dep.version.contains('grace-framework.version') ? projectVersion : dep.version
                                    if (dep.type == 'pom') {
                                        mkp.type 'pom'
                                        mkp.scope 'import'
                                    }
                                }
                            }

                        }
                    }
                }
            }
        }
    }
}

configurations {
	effectiveBom
}

def effectiveBom = file("$buildDir/generated/effective-bom/${project.name}-effective.xml")

task generateEffectiveBom(type: Copy) {
    dependsOn generatePomFileForMavenPublication
	from("$buildDir/publications/maven") {
        include "pom-default.xml"
        filter(org.apache.tools.ant.filters.ReplaceTokens, beginToken: '${', endToken: '}', tokens: properties)
    }
    destinationDir = file("$buildDir/generated/effective-bom")
    rename "pom-default.xml", "${project.name}-effective.xml"
}

artifacts {
    add("effectiveBom", effectiveBom) {
        builtBy(generateEffectiveBom)
    }
}