buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath libs.groovy.toml
        classpath "org.graceframework:grace-gradle-plugin:2024.0.0-RC1"
    }
}

apply plugin: 'groovy'
apply plugin: 'java-library'
apply plugin: 'org.graceframework.grace-doc'

def DOCUMENTATION_GROUP = 'Documentation'

def toml = new groovy.toml.TomlSlurper()
def versions = toml.parse(rootProject.file('gradle/libs.versions.toml')).versions
def groovyVersion = versions['groovy']
def graceAsyncVersion = versions['grace-async']
def graceEventsVersion = versions['grace-events']
def graceDataVersion = versions['grace-data']
def graceDataHibernateVersion = versions['grace-data-hibernate']
def graceDataMongoDBVersion = versions['grace-data-mongodb']
def springFrameworkVersion = versions['spring-framework']
def springBootVersion = versions['spring-boot']

repositories {
    mavenCentral()
}

configurations {
    documentation
}

dependencies {
    documentation libs.grace.async.core
    documentation libs.grace.datastore.core
    documentation libs.grace.datastore.gorm
    documentation libs.grace.datastore.gorm.bson
    documentation libs.grace.datastore.gorm.hibernate
    documentation libs.grace.datastore.gorm.mongodb
    documentation libs.grace.datastore.gorm.support
    documentation libs.grace.datastore.web
    documentation libs.grace.events.core
    documentation libs.groovy.ant
    documentation libs.groovy.console
    documentation libs.groovy.core
    documentation libs.groovy.groovydoc
    documentation libs.groovy.groovysh
    documentation libs.groovy.json
    documentation libs.groovy.swing
    documentation libs.groovy.templates
    documentation libs.groovy.xml
    documentation libs.hibernate.core
    documentation libs.jakarta.servlet
    documentation libs.javaparser
    documentation libs.spring.boot
    documentation libs.spring.boot.actuator.autoconfigure
    documentation libs.spring.boot.autoconfigure
    documentation libs.spring.context
    documentation libs.spring.contextSupport
    documentation libs.spring.core
    documentation libs.spring.orm
    documentation libs.spring.tx
    documentation libs.spring.web
    documentation libs.spring.webmvc
    documentation libs.snakeyaml
}

jar {
    enabled = false
}

javadocJar {
    enabled = false
}

sourcesJar {
    enabled = false
}

def cleanTask = project.tasks.findByName('clean')
if (cleanTask == null) {
    task clean(type: Delete) {
        delete(buildDir)
    }
}
else {
    cleanTask.doLast {
        ant.delete(dir: 'build/docs')
    }
}

tasks.register('groovyapidoc', DefaultTask) {
    group = DOCUMENTATION_GROUP
    description = 'Generate Groovydoc using Ant with custom config'

    ant.taskdef(name: 'groovydoc',
        classname: 'org.codehaus.groovy.ant.Groovydoc',
        classpath: (sourceSets.main.compileClasspath + configurations.documentation).asPath)

    def docTitle = "Grace Framework - ${project.version}"
    def outputDir = project.file('build/docs/manual/api')

    doLast {
        def files = []
        project.rootProject.subprojects
                .findAll { !it.name != 'docs' && !it.name.startsWith('grace-test-suite') }
                .each { subproject ->
                    if(subproject.file('src/main/groovy').exists()) {
                        files += subproject.files('src/main/groovy')
                    }
                    if(subproject.file('src/main/java').exists()) {
                        files += subproject.files('src/main/java')
                    }
                }

        if (project.file('src/main/groovy').exists()) {
            files += project.files('src/main/groovy')
        }

        ant.groovydoc(
            doctitle: docTitle,
            windowtitle: docTitle,
            footer: '',
            sourcepath: files.join(':'),
            destdir: outputDir,
            packagenames: '**.*',
            javaVersion: 'JAVA_17') {
                link(packages: 'java.', href: 'https://docs.oracle.com/en/java/javase/17/docs/api/java.base/')
                link(packages: 'jakarta.annotation.', href: 'https://jakarta.ee/specifications/annotations/2.1/apidocs/')
                link(packages: 'jakarta.servlet.', href: 'https://jakarta.ee/specifications/servlet/6.0/apidocs/')
                link(packages: 'groovy.,org.codehaus.groovy.,org.apache.groovy.', href: "https://docs.groovy-lang.org/docs/groovy-${groovyVersion}/html/gapi/")
                link(packages: 'org.hibernate.', href: "https://docs.hibernate.org/orm/5.6/javadocs/")
                link(packages: 'org.springframework.core.,org.springframework.context.,org.springframework.beans.', href: "https://docs.spring.io/spring-framework/docs/${springFrameworkVersion}/javadoc-api")
                link(packages: 'org.springframework.boot.,org.springframework.boot.actuate.info.', href: "https://docs.spring.io/spring-boot/${springBootVersion[0..2]}/api/java")
                link(packages: 'grails.async.,grails.async.decorator.,org.grails.async.', href: "https://graceframework.org/grace-async/${graceAsyncVersion}/api/")
                link(packages: 'grails.events.,org.grails.events.', href: "https://graceframework.org/grace-events/${graceEventsVersion}/api/")
                link(packages: 'grails.gorm.hibernate.,org.grails.orm.hibernate.', href: "https://graceframework.org/grace-data-hibernate/${graceDataHibernateVersion}/api/")
                link(packages: 'grails.mongodb.,grails.gorm.mongo.,org.grails.datastore.bson.,org.grails.datastore.gorm.mongo.,org.grails.datastore.mapping.mongo.', href: "https://graceframework.org/grace-data-mongodb/${graceDataMongoDBVersion}/api/")
                link(packages: 'grails.core.support.proxy.,grails.persistence.support.,grails.gorm.validation.,org.grails.datastore.gorm.support.,org.grails.datastore.gorm.validation.constraints.,org.grails.datastore.mapping.web.support.,org.grails.datastore.mapping.multitenancy.web.,grails.gorm.,org.grails.datastore.,org.grails.datastore.mapping.,org.grails.datastore.mapping.model.,org.grails.datastore.gorm.', href: "https://graceframework.org/grace-data/${graceDataVersion}/api/")
        }
    }
}

publishGuide {
    dependsOn tasks.named('groovyapidoc')
    sourceDir = project.file('src/docs')
}

tasks.register('docs') {
    dependsOn publishGuide
}
