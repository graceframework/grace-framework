group = "org.graceframework.plugins"

dependencies {
    compileOnly("org.graceframework:grace-boot")
    compileOnly("org.graceframework:grace-bootstrap")
    compileOnly "org.graceframework:grace-core", {
        exclude group: 'org.graceframework', module: 'grace-datastore-core'
    }
    api "jakarta.persistence:jakarta.persistence-api"
    api "org.springframework:spring-orm"
    api "org.hibernate:hibernate-core-jakarta:${hibernateCoreVersion}"
    api "org.graceframework:grace-datastore-core"
    api "org.graceframework:grace-datastore-web"
    api "org.graceframework:grace-datastore-gorm"
    api "org.graceframework:grace-datastore-gorm-support"
    api project(":grace-datastore-gorm-hibernate")

    api("org.springframework.boot:spring-boot-autoconfigure")
    annotationProcessor("org.springframework.boot:spring-boot-autoconfigure-processor")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")

    testImplementation "jakarta.servlet:jakarta.servlet-api"
    testImplementation "jakarta.persistence:jakarta.persistence-api"
    testImplementation "jakarta.transaction:jakarta.transaction-api"
    testImplementation "jakarta.validation:jakarta.validation-api"
    testRuntimeOnly "org.hibernate.validator:hibernate-validator", {
        exclude group: "jakarta.validation", module: "jakarta.validation-api"
    }
    testImplementation "org.spockframework:spock-core", {
        exclude group: "junit", module: "junit-dep"
        exclude group: 'org.codehaus.groovy', module: 'groovy-all'
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }
    testRuntimeOnly "org.yaml:snakeyaml"
    testImplementation "org.graceframework:grace-test-support"
    testRuntimeOnly "com.h2database:h2"
    testRuntimeOnly "org.apache.tomcat:tomcat-jdbc"
    testRuntimeOnly "org.springframework:spring-aop"
    testRuntimeOnly "org.springframework:spring-expression"
    testRuntimeOnly "org.glassfish.expressly:expressly:$jakartaElImplVersion"
}

groovydoc.classpath += configurations.documentation

jar {
    enabled = true
    archiveClassifier.set('plugin')
    includeEmptyDirs = false
}