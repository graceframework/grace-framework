dependencies {
    compileOnly project(":grace-plugin-api")
    api project(":grace-plugin-databinding")
    implementation project(":grace-plugin-taglibs")
    api project(":grace-plugin-validation")
    api project(":grace-scaffolding-core")
    api project(":grace-web")
    api project(":grace-web-gsp")
    implementation libs.grace.datastore.core
    implementation libs.grace.datastore.gorm
    implementation libs.grace.datastore.gorm.support
    api libs.commons.lang3
    compileOnly libs.jakarta.servlet

    api libs.spring.boot.autoconfigure
    annotationProcessor libs.spring.boot.autoconfigureProcessor
    annotationProcessor libs.spring.boot.configurationProcessor

    testImplementation project(":grace-test")
    testImplementation project(":grace-test-support")
    testImplementation libs.bytebuddy
    testImplementation libs.objenesis
    testImplementation libs.groovy.dateutil
    testImplementation libs.jodd.wot
}

tasks.register("compileDefaultTemplates", JavaExec) {
    it.dependsOn('classes')
    it.mainClass.set("org.grails.web.pages.GroovyPageCompilerForkTask")
    it.classpath(project.configurations.getByName('compileClasspath'))

    def arguments = [
            project.file("app/views").absolutePath,
            project.layout.buildDirectory.dir("classes/gsp/main").get().asFile.canonicalPath,
            project.layout.buildDirectory.dir('tmp/gsp').get().asFile.absolutePath,
            '17',
            'fields/views',
            '/WEB-INF/grails-app/views/',
            ',',
            'UTF-8'
    ]
    it.args(arguments)
    doFirst {
        ant.delete(dir: 'build/classes/gsp/main')
    }
}

tasks.register("syncScripts", Sync) {
    from("src/main/scripts")
    into("build/resources/main/META-INF/commands")
}

tasks.register("syncTemplates", Sync) {
    from("src/main/templates")
    into("build/resources/main/META-INF/templates")
}

processResources {
    dependsOn = ["syncScripts", "syncTemplates"]
}

jar {
    dependsOn = ["compileDefaultTemplates"]
    from(project.layout.buildDirectory.dir("classes/gsp/main"))
}
